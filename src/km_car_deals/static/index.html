<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>KM Car Deals — Dealership OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="10" fill="url(#bg)"/><path d="M7 24l4-8h14l4 8H7z" fill="white" fill-opacity=".95"/><circle cx="12" cy="24" r="2.5" fill="#0a0f1a"/><circle cx="24" cy="24" r="2.5" fill="#0a0f1a"/><path d="M11 20l2-4h10l2 4H11z" fill="white" fill-opacity=".6"/><defs><linearGradient id="bg" x1="0" y1="0" x2="36" y2="36"><stop stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient></defs></svg>
        </div>
        <div class="brand-text"><strong>KM Car Deals</strong><span>Dealership OS</span></div>
        <button class="sidebar-close" id="sidebarClose">✕</button>
      </div>
      <div class="sidebar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Quick search…" id="globalSearch" autocomplete="off"/>
      </div>
      <nav class="nav">
        <div class="nav-group-label">Main</div>
        <a href="#" class="nav-item active" data-view="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span><span class="nav-badge" id="nb-dashboard"></span></a>
        <a href="#" class="nav-item" data-view="inventory"><span class="nav-icon">🚗</span><span class="nav-label">Inventory</span><span class="nav-badge" id="nb-inventory"></span></a>
        <a href="#" class="nav-item" data-view="intake"><span class="nav-icon">⚡</span><span class="nav-label">AI Intake</span></a>
        <a href="#" class="nav-item" data-view="approval"><span class="nav-icon">✅</span><span class="nav-label">Approval Queue</span><span class="nav-badge" id="nb-approval"></span></a>
        <div class="nav-group-label" style="margin-top:8px">CRM</div>
        <a href="#" class="nav-item" data-view="customers"><span class="nav-icon">👥</span><span class="nav-label">Customers</span></a>
        <a href="#" class="nav-item" data-view="leads"><span class="nav-icon">📞</span><span class="nav-label">Leads</span></a>
        <div class="nav-group-label" style="margin-top:8px">Reports</div>
        <a href="#" class="nav-item" data-view="analytics"><span class="nav-icon">📈</span><span class="nav-label">Analytics</span></a>
        <a href="#" class="nav-item" data-view="audit"><span class="nav-icon">📋</span><span class="nav-label">Audit Log</span></a>
        <a href="#" class="nav-item" data-view="settings"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a>
        <a href="#" class="nav-item" data-view="docs"><span class="nav-icon">📖</span><span class="nav-label">API Docs</span></a>
        <div class="nav-group-label" style="margin-top:8px">Public</div>
        <a href="/catalog" target="_blank" class="nav-item"><span class="nav-icon">🌐</span><span class="nav-label">Website Catalog ↗</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-card">
          <div class="user-avatar">KM</div>
          <div class="user-info"><strong>Admin</strong><span id="apiStatus" class="status-chip"><span class="dot"></span>Connecting…</span></div>
          <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀</button>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="breadcrumb">
          <span class="bc-home">🏠</span>
          <span class="bc-sep">›</span>
          <span class="bc-current" id="pageTitle">Dashboard</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="topbar-icon-btn" id="refreshBtn" title="Refresh">↺</button>
        <button class="btn btn-primary btn-sm" data-goto="intake">＋ Add Vehicle</button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Details</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
